services:
  app:
    build:
      context: .
      target: builder
    user: "1000:1000"
    working_dir: /app
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://byjc:byjc_dev@db:5432/byjc
    env_file:
      - .env.local
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: byjc
      POSTGRES_PASSWORD: byjc_dev
      POSTGRES_DB: byjc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U byjc -d byjc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
