name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve target URL
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          # Pull requests audit their own Vercel preview; pushes to main audit production.
          if [ "$IS_PR" != "true" ]; then
            echo "base=https://byjc.dev" >> "$GITHUB_OUTPUT"
            echo "config=.lighthouserc.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for i in $(seq 1 60); do
            # Transient API failures are retried like "not ready yet".
            if deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA&environment=Preview" --jq '.[0].id // empty'); then
              id="$deployments"
            else
              echo "Deployments lookup failed (attempt $i); retrying"; sleep 15; continue
            fi
            if [ -n "$id" ]; then
              if ! status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0] | [.state, (.environment_url // "")] | @tsv'); then
                echo "Deployment status lookup failed (attempt $i); retrying"; sleep 15; continue
              fi
              IFS=$'\t' read -r state url <<< "$status"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "base=${url%/}" >> "$GITHUB_OUTPUT"
                echo "config=.lighthouserc.preview.json" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::Preview deployment $state"; exit 1
              fi
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for the Vercel preview deployment"; exit 1

      - name: Skip notice for fork PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Lighthouse skipped - fork PRs cannot receive the Vercel protection bypass secret."

      - name: Run Lighthouse CI
        # Fork PRs never receive secrets, so the protected preview cannot be audited; skipped above.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          BASE="$TARGET_BASE"
          CONFIG="$LHCI_CONFIG"
          # Previews sit behind Vercel deployment protection; send the automation bypass header (PR runs only).
          # Header is sent on every request, so do not also ask for the bypass cookie: that makes Vercel
          # inject the preview toolbar, whose vercel.live feedback.js sets a third-party cookie and fails
          # the third-party-cookies / inspector-issues audits (best-practices < 0.9).
          if [ "$IS_PR" = "true" ] && [ -n "$VERCEL_BYPASS" ]; then
            echo "::add-mask::$VERCEL_BYPASS"
            CONFIG="$RUNNER_TEMP/lighthouserc.bypass.json"
            jq --arg v "$VERCEL_BYPASS" \
              '.ci.collect.settings.extraHeaders = {"x-vercel-protection-bypass": $v}' \
              "$LHCI_CONFIG" > "$CONFIG"
          elif [ "$IS_PR" = "true" ]; then
            # No bypass secret: audit only if the preview is publicly reachable, never Vercel's protection page.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/" || echo 000)
            if [ "$code" = "401" ] || [ "$code" = "403" ]; then
              echo "::warning::Preview is protected (HTTP $code) and VERCEL_AUTOMATION_BYPASS_SECRET is not set; skipping Lighthouse audit."
              exit 0
            fi
          fi
          npx lhci autorun --config="$CONFIG" \
            --collect.url="$BASE/" \
            --collect.url="$BASE/blogs" \
            --collect.url="$BASE/portfolio"
        env:
          TARGET_BASE: ${{ steps.target.outputs.base }}
          LHCI_CONFIG: ${{ steps.target.outputs.config }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30
